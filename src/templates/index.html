<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.discordapp.com/app-icons/1290423568315715604/e72451950ac5f21d3dfc76d87f3684a0.png?size=4096" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/todo.css') }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://pro.fontawesome.com/releases/v6.0.0-beta2/css/all.css" />
    <title>{{ display_name }} | TODO List</title>
  </head>

  <body>
    <svg
      class="absolute z-[10] top-[-107vh] left-[-1vw]"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 3787 2842"
      fill="none">
      <g filter="url(#filter)">
        <ellipse
          cx="1924.71"
          cy="273.501"
          rx="1924.71"
          ry="273.501"
          transform="matrix(-0.822377 -0.568943 -0.568943 0.822377 3631.88 2291.09)"
          class="fill-[#86efac]"
          fill-opacity="0.21"></ellipse>
      </g>
      <defs>
        <filter
          id="filter"
          x="0.860352"
          y="0.838989"
          width="3785.16"
          height="2840.26"
          filterUnits="userSpaceOnUse"
          color-interpolation-filters="sRGB">
          <feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood>
          <feBlend
            mode="normal"
            in="SourceGraphic"
            in2="BackgroundImageFix"
            result="shape"></feBlend>
          <feGaussianBlur
            stdDeviation="151"
            result="effect1_foregroundBlur_1065_8"></feGaussianBlur>
        </filter>
      </defs>
    </svg>
    <div class="relative z-[20]">
      <div class="mt-[3vh]">
        <h2 class="heading text-center">Todo List</h2>
      </div>
      <div
        class="todo-app bg-[#ffffff0a] mx-[10vw] lg:mx-[17vw] mt-[1.7vh]"
        style="backdrop-filter: blur(6.2px)">
        <div class="inputs mb-5">
          <div class="form-group flex flex-col gap-[0.10rem]">
            <label for="title">Title</label>
            <input
              autocomplete="off"
              type="text"
              class="form-control"
              id="title"
              aria-describedby="emailHelp"
              required="" />
          </div>

          <div class="form-group flex flex-col gap-[0.10rem] mt-3">
            <label for="description">Description</label>
            <input class="form-control" id="description" rows="3" />
          </div>
        </div>

        <div class="flex flex-wrap gap-2">
          <button id="add" class="button w-full lg:w-[unset]">
            Add to list
          </button>
        </div>

        <div id="items" class="mt-4 mb-0">
          <h2 class="text-3xl your-items">{{ display_name }}'s Items</h2>
          <div
            id="todos"
            class="todos flex flex-row flex-wrap gap-5 mt-3"></div>
        </div>
      </div>
    </div>

    <script>
      window.onload = () => {
        update();
      };

      const USER_ID = '{{ user_id }}';

      document.getElementById('add').addEventListener('click', async () => {
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, user_id: USER_ID })
        });
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        update();
      });

      async function update() {
        const response = await fetch(`/all?id=${encodeURIComponent(USER_ID)}`);
        const data = await response.json();
        const tableBody = document.getElementById('todos');

        const existingRows = Array.from(tableBody.children);
        for (const row of existingRows) {
          row.classList.add('fade-out');
        }

        setTimeout(() => {
          tableBody.innerHTML = '';

          data.items.forEach((item) => {
            const wrapper = document.createElement('div');
            wrapper.id = `todo-${item.id}`;
            wrapper.className =
              'todo w-full lg:w-[unset] flex justify-between items-center p-4 px-[1.15rem] rounded-[10px] border border-[#ffffff24] bg-[#ffffff0d]';
            wrapper.innerHTML = `
        <div>
          <h3 class="todo-title text-[#FAF9F6]">${item.title}</h3>
          <p class="todo-description text-[#dddddd] text-lg">${item.description}</p>
        </div>
        <button onclick="deleting('${item.id}')" class="ml-6 button clear-todo">
          <i class="fa-regular text-[#dddddd] fa-xmark"></i>
        </button>
      `;
            tableBody.appendChild(wrapper);
          });
        }, 400);
      }

      async function deleting(id) {
        try {
          document.querySelector(`#todo-${id}`).remove();
          await fetch('/delete', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          });

          if (res.ok) {
            console.log(data.message);
          } else {
            console.error(data.error || 'Failed to delete todo');
          }
        } catch (err) {
          console.error(err);
        }
      }
    </script>
  </body>
</html>
